services:
  app:
    build:
      context: ..
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:?Configure a origem HTTPS}
      DATABASE_PATH: /var/data/commerce.sqlite
      BACKUP_ENABLED: "true"
      BACKUP_RETENTION: "7"
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - commerce-data:/var/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  commerce-data:
