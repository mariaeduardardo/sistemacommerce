services:
  - type: web
    name: commerce-visual
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    numInstances: 1
    disk:
      name: commerce-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_PATH
        value: /var/data/commerce.sqlite
      - key: APP_ORIGINS
        sync: false
      - key: TRUST_PROXY
        value: true
      - key: BACKUP_ENABLED
        value: true
      - key: BACKUP_RETENTION
        value: 7
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RESET_EMAIL
        sync: false
      - key: RESET_PASSWORD
        sync: false
